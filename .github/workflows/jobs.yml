name: Job Bot
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install playwright requests && playwright install chromium

      - name: Run bot
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save jobs.json
        run: |
          ls -lh jobs.json
          cat jobs.json
          git config user.name "Job Bot"
          git config user.email "bot@bot.com"
          git add jobs.json -f
          git commit -m "update seen jobs" || echo "no changes"
          git push
